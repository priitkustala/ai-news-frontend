# Intake triage (priitkustala/ai-news#118): an issue opened or edited with the label needs-triage is
# read by its number; the script checks the contributor form, posts one comment with relevance x
# importance and the rank word (Now, Next, Later) and swaps needs-triage for triaged, or names the
# missing fields and keeps the label. It never repeats a comment and never echoes the issue text:
# only the issue number and the job's own token reach the run step. No board item, no secret.
name: triage-issues

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    if: contains(github.event.issue.labels.*.name, 'needs-triage')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/triage
      - name: Triage the issue
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/triage/triage-issues.py
